name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run decoder tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/test_mqtt_decoder.py
      - name: Run synthetic decoder demo
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/decode_synthetic.py examples/synthetic-messages.json
